apiVersion: v1
kind: ConfigMap
metadata:
  name: hymio-operator-metrics-prometheus-config
  namespace: hymio-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: hymio-operator
        scheme: https
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets:
              - operator-controller-manager-metrics-service.operator-system.svc.cluster.local:8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hymio-operator-metrics-prometheus
  namespace: hymio-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hymio-operator-metrics-prometheus
  template:
    metadata:
      labels:
        app: hymio-operator-metrics-prometheus
    spec:
      serviceAccountName: hymio-prometheus-metrics
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.3
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: hymio-operator-metrics-prometheus-config
        - name: data
          emptyDir: {}
