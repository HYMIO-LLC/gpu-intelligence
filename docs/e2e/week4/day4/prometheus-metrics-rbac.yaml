apiVersion: v1
kind: ServiceAccount
metadata:
  name: hymio-prometheus-metrics
  namespace: hymio-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hymio-prometheus-metrics-reader
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hymio-prometheus-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hymio-prometheus-metrics-reader
subjects:
  - kind: ServiceAccount
    name: hymio-prometheus-metrics
    namespace: hymio-monitoring
