apiVersion: apps/v1
kind: Deployment
metadata:
  name: hymio-alert-receiver
  namespace: hymio-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hymio-alert-receiver
  template:
    metadata:
      labels:
        app: hymio-alert-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: receiver
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -B
            - -u
            - /app/receiver.py
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: hymio-alert-receiver-code
---
apiVersion: v1
kind: Service
metadata:
  name: hymio-alert-receiver
  namespace: hymio-monitoring
spec:
  selector:
    app: hymio-alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
