  receiver.py: |
    #!/usr/bin/env python3
    """Local E2E receiver for Alertmanager notifications."""

    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    class AlertReceiver(BaseHTTPRequestHandler):
        def respond(self, status, message):
            body = json.dumps({"message": message}).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.respond(200, "ready")
            else:
                self.respond(404, "not found")

        def do_POST(self):
            if self.path != "/alerts":
                self.respond(404, "not found")
                return

            try:
                length = int(self.headers.get("Content-Length", "0"))
                if length <= 0 or length > 1024 * 1024:
                    self.respond(400, "invalid content length")
                    return

                payload = json.loads(self.rfile.read(length))
                if not isinstance(payload, dict):
                    raise ValueError("expected JSON object")

                alerts = payload.get("alerts", [])
                if not isinstance(alerts, list):
                    raise ValueError("expected alerts list")

                event = {
                    "event": "alertmanager_webhook_received",
                    "received_at": datetime.now(
                        timezone.utc
                    ).isoformat(),
                    "receiver": payload.get("receiver"),
                    "status": payload.get("status"),
                    "alerts": [
                        {
                            "status": alert.get("status"),
                            "alertname": alert.get(
                                "labels", {}
                            ).get("alertname"),
                            "namespace": alert.get(
                                "labels", {}
                            ).get("namespace"),
                            "policy": alert.get(
                                "labels", {}
                            ).get("policy"),
                            "fingerprint": alert.get("fingerprint"),
                        }
                        for alert in alerts
                        if isinstance(alert, dict)
                    ],
                }

                print(json.dumps(event), flush=True)
                self.respond(200, "received")

            except (ValueError, TypeError, KeyError) as exc:
                self.respond(400, str(exc))


    if __name__ == "__main__":
        server = ThreadingHTTPServer(
            ("0.0.0.0", 8080),
            AlertReceiver,
        )
        print("Alert receiver listening on :8080", flush=True)
        server.serve_forever()
