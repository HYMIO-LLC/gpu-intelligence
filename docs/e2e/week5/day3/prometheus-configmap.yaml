apiVersion: v1
data:
  gpu-health-alerts.yml: |
    groups:
      - name: hymio-gpu-health
        interval: 15s
        rules:
          - alert: GPUOverheating
            expr: hymio_gpu_policy_healthy == 0
            for: 30s
            labels:
              severity: warning
              component: gpu-health-operator
            annotations:
              summary: "GPU health policy {{ $labels.policy }} is unhealthy"
              description: "GPU health policy {{ $labels.namespace }}/{{ $labels.policy }} reports an unhealthy GPU state."

          - alert: GPUTelemetryUnavailable
            expr: hymio_gpu_policy_telemetry_available == 0
            for: 1m
            labels:
              severity: warning
              component: gpu-health-operator
            annotations:
              summary: "GPU telemetry unavailable for {{ $labels.policy }}"
              description: "GPU telemetry is unavailable for policy {{ $labels.namespace }}/{{ $labels.policy }}."

          - alert: GPUOperatorMetricsDown
            expr: (up{job="hymio-operator"} == 0) or absent(up{job="hymio-operator"})
            for: 1m
            labels:
              severity: critical
              component: gpu-health-operator
            annotations:
              summary: "Hymio GPU Operator metrics endpoint is down"
              description: "Prometheus cannot scrape the Hymio GPU Operator metrics endpoint."
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/gpu-health-alerts.yml

    alerting:
      alertmanagers:
        - scheme: http
          static_configs:
            - targets:
                - hymio-alertmanager.hymio-monitoring.svc.cluster.local:9093

    scrape_configs:
      - job_name: hymio-operator
        scheme: https
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets:
              - operator-controller-manager-metrics-service.operator-system.svc.cluster.local:8443
kind: ConfigMap
metadata:
  name: hymio-operator-metrics-prometheus-config
  namespace: hymio-monitoring
