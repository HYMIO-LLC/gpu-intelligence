apiVersion: gpu.hymio.dev/v1alpha1
kind: GPUHealthPolicy
metadata:
  name: gpuhealthpolicy-sample
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
spec:
  nodeSelector:
    matchLabels:
      accelerator: nvidia
  maxTemperatureCelsius: 85
  action: AlertOnly
